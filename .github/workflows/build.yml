name: Build and Package FMSuperScout

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FMSuperScout Installer (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: FMSuperScout-1.5.0/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Tauri Backend (Release)
        working-directory: FMSuperScout-1.5.0/src-tauri
        run: cargo build --release

      - name: Build Installer (App + Plugin)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          powershell -NoProfile -ExecutionPolicy Bypass -File "FMSuperScout-1.5.0/installer/build-installer.ps1" -RepoRoot "."

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMSuperScout-Setup-windows-x64
          path: |
            FMSuperScout-1.5.0/dist/FMSuperScout-Setup.exe
            FMSuperScout-1.5.0/dist/FMSuperScout-Setup.exe.sha256
            FMSuperScout-1.5.0/dist/version.json
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: FMSuperScout-Setup-windows-x64
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.0' }}
          files: ./release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
